<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offer Range Calculator</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2430; --muted:#6b7686; --accent:#1f6f5c; --line:#dde1e7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232a; --text:#eef1f4; --muted:#98a3b1; --accent:#5cc7a8; --line:#2d353e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; width:100%; max-width:420px; }
  h1 { font-size:20px; margin:0 0 20px; }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; font-size:20px; padding:12px; border:1px solid var(--line); border-radius:8px;
          background:var(--bg); color:var(--text); }
  input:focus { outline:2px solid var(--accent); }
  .result { margin-top:24px; display:none; }
  .row { display:flex; justify-content:space-between; align-items:baseline; padding:12px 0; border-top:1px solid var(--line); }
  .row span { color:var(--muted); font-size:14px; }
  .row strong { font-size:22px; color:var(--accent); }
  .tier { font-size:13px; color:var(--muted); margin-bottom:4px; }
  .copy-block { margin-top:20px; display:none; }
  .copy-row { display:flex; gap:8px; }
  .copy-row input { flex:1; font-size:18px; }
  .copy-row button { border:1px solid var(--line); background:var(--accent); color:#fff; border-radius:8px; padding:12px 14px; font-weight:600; cursor:pointer; }
  .copy-row button:hover { filter:brightness(1.05); }
</style>
</head>
<body>
  <div class="card">
    <h1>Offer Range Calculator</h1>
    <label for="v">Expected resale</label>
    <input id="v" type="text" inputmode="decimal" placeholder="e.g. 300k or 300000" autofocus>
    <div class="result" id="res">
      <div class="tier" id="tier"></div>
      <div class="row"><span id="lo-l"></span><strong id="lo"></strong></div>
      <div class="row"><span id="hi-l"></span><strong id="hi"></strong></div>
    </div>
    <div class="copy-block" id="copyBlock">
      <label for="copyRange">You may copy this shi bro</label>
      <div class="copy-row">
        <input id="copyRange" type="text" readonly>
        <button type="button" id="copyBtn">Copy</button>
      </div>
    </div>
  </div>

<script>
  const tiers = [
    { max: 250000,   lo: 0.45, hi: 0.60, name: "0 – 250k" },
    { max: 500000,   lo: 0.60, hi: 0.70, name: "250k – 500k" },
    { max: 1000000,  lo: 0.65, hi: 0.75, name: "500k – 1m" },
    { max: Infinity, lo: 0.70, hi: 0.80, name: "1m+" }
  ];

  function parse(s) {
    s = s.toLowerCase().replace(/[, ]/g, "");
    let m = 1;
    if (s.endsWith("k")) { m = 1e3; s = s.slice(0, -1); }
    else if (s.endsWith("m")) { m = 1e6; s = s.slice(0, -1); }
    const n = parseFloat(s);
    return isNaN(n) ? null : n * m;
  }

  const fmt = n => n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  const compact = n => {
    const exact = Math.round(n);
    if (exact % 1000 === 0) return `${exact / 1000}k`;
    return exact.toLocaleString();
  };

  const copyBlock = document.getElementById("copyBlock");
  const copyRange = document.getElementById("copyRange");

  function getTier(value) {
    if (value >= 1000000) return tiers[3];
    if (value >= 500000) return tiers[2];
    if (value >= 250000) return tiers[1];
    return tiers[0];
  }

  document.getElementById("v").addEventListener("input", e => {
    const res = document.getElementById("res");
    const val = parse(e.target.value);
    if (!val || val <= 0) {
      res.style.display = "none";
      copyBlock.style.display = "none";
      return;
    }
    const t = getTier(val);
    const lo = val * t.lo;
    const hi = val * t.hi;

    document.getElementById("tier").textContent = "Tier: " + t.name;
    document.getElementById("lo-l").textContent = Math.round(t.lo * 100) + "%";
    document.getElementById("hi-l").textContent = Math.round(t.hi * 100) + "%";
    document.getElementById("lo").textContent = fmt(lo);
    document.getElementById("hi").textContent = fmt(hi);

    copyRange.value = `${compact(lo)} - ${compact(hi)}`;
    copyBlock.style.display = "block";
    res.style.display = "block";
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(copyRange.value);
      document.getElementById("copyBtn").textContent = "Copied";
      setTimeout(() => document.getElementById("copyBtn").textContent = "Copy", 1200);
    } catch (err) {
      copyRange.focus();
      copyRange.select();
      document.execCommand("copy");
      document.getElementById("copyBtn").textContent = "Copied";
      setTimeout(() => document.getElementById("copyBtn").textContent = "Copy", 1200);
    }
  });
</script>
</body>
</html>
